name: docs

# Builds the documentation site strictly (every Sphinx warning is an error) on every push and pull request, and on
# main deploys it to GitHub Pages. The deploy job runs only once Pages is switched on with "GitHub Actions" as its
# source (Settings -> Pages -> Build and deployment -> Source); until then it is skipped, and the build still checks
# the docs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r docs/requirements.txt
      - name: API page up to date
        run: python docs/_scripts/make_api.py --check
      - name: Build (strict)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Is GitHub Pages switched on with GitHub Actions as its source?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not switched on with GitHub Actions as its source; the site was built but not deployed."
          fi

  deploy:
    needs: [build, pages]
    if: needs.pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
